[project]
name = "rag"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch==2.10.0",
    "chromadb>=1.5.1",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.14",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.10",
    "beautifulsoup4>=4.13.4",
    "requests>=2.32.3",
    "python-multipart>=0.0.20",
    "docx2txt>=0.8",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.2",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.3",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.126.0",
    "google-auth-httplib2>=0.2.0",
    "grpcio!=1.78.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "rank-bm25>=0.2.2",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ipykernel>=7.2.0",
    "pytest>=8.3.0",
]
evaluation = [
    "datasets>=4.2.0",
    "ragas>=0.3.8",
]
legacy = [
    "faiss-cpu>=1.13.2",
    "langchain-groq>=1.1.2",
    "streamlit>=1.45.0",
]

# The production server uses CPU inference; avoid CUDA wheels on Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
